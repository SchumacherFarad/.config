################################################################################
#                                                                              #
#                        HYPRLAND MAIN CONFIGURATION                           #
#                                                                              #
################################################################################
# Wiki: https://wiki.hypr.land/Configuring/
#
# This is the main configuration file that sources all modular configs.
# Edit individual files in ~/.config/hypr/ for specific settings.

# Source configuration files
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/programs.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/environment.conf
source = ~/.config/hypr/look-and-feel.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/window-rules.conf
source = ~/.config/hypr/workspace-rules.conf
