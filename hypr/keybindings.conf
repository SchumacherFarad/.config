################################################################################
# KEYBINDINGS CONFIGURATION
################################################################################
# https://wiki.hypr.land/Configuring/Binds/

$mainMod = SUPER

#------------------------------------------------------------------------------
# Application Launchers
#------------------------------------------------------------------------------

bind = $mainMod, T, exec, $terminal
bind = SUPER SHIFT, E, exec, $fileManager
bind = $mainMod, SPACE, exec, $menu

#------------------------------------------------------------------------------
# Window Management
#------------------------------------------------------------------------------

bind = $mainMod, W, killactive,
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper-picker.sh
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pin,
bind = $mainMod, J, layoutmsg, togglesplit,
bind = $mainMod, F, fullscreen,

#------------------------------------------------------------------------------
# Lock
#------------------------------------------------------------------------------

bind = $mainMod, L, exec, hyprlock

#------------------------------------------------------------------------------
# Focus Movement
#------------------------------------------------------------------------------

bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

#------------------------------------------------------------------------------
# Workspace Switching
#------------------------------------------------------------------------------

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

#------------------------------------------------------------------------------
# Move Window to Workspace
#------------------------------------------------------------------------------

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

#------------------------------------------------------------------------------
# Special Workspace (Scratchpad)
#------------------------------------------------------------------------------

bind = $mainMod,       S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

#------------------------------------------------------------------------------
# Mouse Bindings
#------------------------------------------------------------------------------

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# Move/resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

#------------------------------------------------------------------------------
# Media Keys
#------------------------------------------------------------------------------

# wpctl yerine swayosd-client kullanarak hem sesi değiştir hem popup gör
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = , XF86AudioMute,        exec, swayosd-client --output-volume mute-toggle
bindel = , XF86AudioMicMute,     exec, swayosd-client --input-volume mute-toggle

# Brightness
# Parlaklık Azaltma (0'a kadar iner)
binde = , XF86MonBrightnessDown, exec, brightnessctl set 10%- 
# Parlaklık Arttırma
binde = , XF86MonBrightnessUp, exec, brightnessctl set 10%+
#KlavyeIşığı
binde = , XF86KbdBrightnessUp, exec, swayosd-client --brightness +10
binde = , XF86KbdBrightnessDown, exec, swayosd-client --brightness -10


# Media playback (requires playerctl)
# Medya Kontrolü + Bildirim (Kapak fotoğrafı ve Şarkı/Sanatçı bilgisiyle)
# Süslü parantezlerin içine birer boşluk ekledik: {{ title }} gibi
# Süslü parantez yok, hata ihtimali yok.
bindl = , XF86AudioNext,  exec, playerctl next && notify-send "Sonraki Parça" "$(playerctl metadata title) - $(playerctl metadata artist)" -i media-skip-forward
bindl = , XF86AudioPrev,  exec, playerctl previous && notify-send "Önceki Parça" "$(playerctl metadata title) - $(playerctl metadata artist)" -i media-skip-backward
bindl = , XF86AudioPause, exec, playerctl play-pause && notify-send "Medya" "Oynat/Duraklat" -i media-playback-pause
bindl = , XF86AudioPlay,  exec, playerctl play-pause && notify-send "Medya" "Oynat/Duraklat" -i media-playback-start

# Smart Screenshot (Window / Monitor / Region)
bind = , Print, exec, ~/.local/bin/hypr-screenshot
